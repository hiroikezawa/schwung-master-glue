# Build, test and (on a v* tag) release MASTER GLUE.
#
# Copyright (c) 2026 Hiro Ikezawa. MIT License (see LICENSE).
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: charlesvestal/schwung
          path: schwung
          sparse-checkout: |
            src/shared
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Toolchains
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Test (native, ASan, UI contract, arm64 + ABI, licences)
        run: SCHWUNG_ROOT="$GITHUB_WORKSPACE/schwung" bash scripts/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: master-glue-module
          path: dist/master-glue-module.tar.gz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/master-glue-module.tar.gz --title "MASTER GLUE $GITHUB_REF_NAME" --notes "See README.md"
